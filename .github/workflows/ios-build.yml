name: iOS Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release after building?'
        required: false
        default: 'false'

env:
  PROJECT: AnimeVsubIOS.xcodeproj
  SCHEME: AnimeVsubIOS
  CONFIGURATION: Release
  SDK: iphoneos
  APP_NAME: AnimeVsubIOS
  IPA_NAME: AnimeVsubIOS.ipa

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for semantic-release

      # ── 2. Select Xcode ────────────────────────────────────────────────────
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        run: xcodebuild -version

      # ── 3. Cache SPM packages ──────────────────────────────────────────────
      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ── 4. Resolve SPM dependencies ────────────────────────────────────────
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath ".build/spm"

      # ── 5. Build (no code signing) ─────────────────────────────────────────
      - name: Build Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -clonedSourcePackagesDirPath ".build/spm" \
            -derivedDataPath ".build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO

      # ── 6. Locate .app bundle ──────────────────────────────────────────────
      - name: Locate .app bundle
        id: locate_app
        run: |
          APP_PATH=$(find .build/DerivedData -name "$APP_NAME.app" \
            -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Could not find $APP_NAME.app in DerivedData"
            find .build/DerivedData -name "*.app" | head -20
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "✅ Found: $APP_PATH"

      # ── 7. Package into unsigned IPA ───────────────────────────────────────
      - name: Create unsigned IPA
        run: |
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$IPA_NAME" Payload
          rm -rf Payload
          echo "📦 IPA created: $IPA_NAME ($(du -sh $IPA_NAME | cut -f1))"

      # ── 8. Verify IPA integrity ────────────────────────────────────────────
      - name: Verify IPA
        run: |
          unzip -l "$IPA_NAME" | head -30
          echo "---"
          ls -lh "$IPA_NAME"

      # ── 9. Upload IPA artifact ─────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: ${{ env.IPA_NAME }}
          retention-days: 30
          if-no-files-found: error

      # ── 10. Determine version for release ──────────────────────────────────
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v$(date +'%Y.%m.%d')-manual"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📌 Release version: $VERSION"

      # ── 11. Generate Release Notes ─────────────────────────────────────────
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        id: release_notes
        run: |
          # Collect commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi
          # Write to file to preserve newlines
          {
            echo "## What's Changed"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo "### ⚠️ Installation"
            echo "> This IPA is **unsigned**. Install via:"
            echo "> - **Jailbroken devices**: AppSync Unified + Filza / iMazing"
            echo "> - **Non-jailbreak**: AltStore or Sideloadly (re-signs with personal cert)"
          } > release_notes.md
          cat release_notes.md

      # ── 12. Create GitHub Release (tag push only) ──────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "AnimeVsub iOS ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: ${{ env.IPA_NAME }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
